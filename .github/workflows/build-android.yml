# Builds the Android .apk (phones, 64-bit ARM) on a GitHub-hosted Linux runner, to sideload.
#
# The runner already has what Android builds need: Java 17, the Android SDK and the NDK. This adds Rust's
# Android target, generates the Android project (`tauri android init`), builds a release APK and signs it.
#
# SIGNING: Android only installs signed APKs, and an update only installs over the old one when both carry the
# SAME key. Set these repository secrets once (Settings > Secrets and variables > Actions) so every build is
# signed with your key:
#   ANDROID_KEYSTORE            base64 of your .jks keystore file
#   ANDROID_KEYSTORE_PASSWORD   its password (the key's password must be the same)
#   ANDROID_KEY_ALIAS           the key's alias inside it
# Without them the APK is signed with a throwaway key made for that one run: fine to try it out, but the next
# build won't install over it (uninstall first). The artifact name says which it is.

name: Build Android

on:
  # Every push to the android branch while the port is being built, and by hand from the Actions tab
  push:
    branches: [android]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also attach the APK to this release (e.g. v1.9.0). Leave empty to skip."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-android:
    name: Android (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only used by the optional "attach to release" step

    steps:
      - name: Check out the code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable branch, 10-25-26
        with:
          toolchain: stable  # pinned to a commit, so the toolchain is named here
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: src-tauri
          key: aarch64-linux-android

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The runner's preinstalled Java 17 and NDK, under the names Tauri and Gradle look for
      - name: Point the build at Java 17 and the NDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Using NDK: $ANDROID_NDK_LATEST_HOME"

      # Generates src-tauri/gen/android (the Gradle project) from tauri.conf.json + tauri.android.conf.json
      - name: Generate the Android project
        run: npx tauri android init --ci

      # Tauri's template comes with Tauri's logo as the app icon. src-tauri/android-res holds Mosaic's: the desktop
      # logo on Mosaic's dark background as an Android adaptive icon (with a one-color version for themed icons),
      # plus plain tiles for launchers that don't use adaptive icons. Copied over the template's files
      - name: Use Mosaic's app icon
        run: |
          res=src-tauri/gen/android/app/src/main/res
          manifest=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          cp -r src-tauri/android-res/. "$res/"
          ls -R "$res" | head -n 60
          grep -n 'android:icon\|android:roundIcon' "$manifest" || true
          grep -q 'android:icon="@mipmap/ic_launcher"' "$manifest" || { echo "::error::the manifest doesn't use @mipmap/ic_launcher as the app icon"; exit 1; }

      # Mosaic plays video through its own small server on the phone (http://127.0.0.1, see stream_relay.rs).
      # Android blocks plain-http connections in release builds unless the app allows them, and Tauri's
      # template only allows them in debug builds, so the release build is switched to allow them too.
      - name: Allow the app's local video server in release builds
        run: |
          f=src-tauri/gen/android/app/build.gradle.kts
          grep -n 'usesCleartextTraffic' "$f"
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$f"
          if grep -q 'usesCleartextTraffic"\] = "false"' "$f"; then echo "::error::couldn't switch usesCleartextTraffic on"; exit 1; fi

      # Picture-in-picture (the player's PiP button, and going into it by itself when you leave the app while
      # watching) needs the activity to say it supports it; Tauri's template doesn't
      - name: Allow picture-in-picture
        run: |
          f=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          # Tauri's template may put "<activity" on a line of its own, so match it before a space or the line's end
          sed -i -E 's/<activity([[:space:]]|$)/<activity android:supportsPictureInPicture="true"\1/' "$f"
          grep -n -A3 '<activity' "$f"
          grep -q 'supportsPictureInPicture' "$f" || { echo "::error::couldn't mark the activity as picture-in-picture capable"; exit 1; }

      # Android pauses the app when it goes out of sight (picture-in-picture, the screen locking, another app), and
      # Tauri's activity pauses the web view with it, which freezes the stream. MainActivity resumes the web view
      # while floating, and while locked or in the background when Background audio says so (the player's Options).
      # For that it also runs PlaybackService (src-tauri/android-src), the foreground service that lets Android
      # keep Mosaic awake with the screen off; it goes next to MainActivity.kt with the same package, as does
      # RestartActivity, which starts Mosaic fresh when Android makes a second copy of its screen (Tauri can't draw
      # into one, it stayed black: a foldable moving Mosaic between its screens while it played in the background)
      - name: Keep the stream playing in picture-in-picture and in the background
        run: |
          f=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt | head -n1)
          if [ -z "$f" ]; then echo "::error::MainActivity.kt not found"; exit 1; fi
          pkg=$(grep -m1 '^package ' "$f")
          if [ -z "$pkg" ]; then echo "::error::MainActivity.kt has no package line"; exit 1; fi
          for kt in src-tauri/android-src/*.kt; do
            { echo "$pkg"; echo; cat "$kt"; } > "$(dirname "$f")/$(basename "$kt")"
          done
          echo "Before:"; cat "$f"
          python3 - "$f" <<'PY'
          import re, sys
          path = sys.argv[1]
          src = open(path).read()
          methods = """
              companion object {
                  // whether this run of the app has made its screen already (mosaicRestartIfRecreated)
                  private var mosaicCreated = false
              }

              // Tauri draws into the first copy of this screen in a run of the app only. Android making another (moving Mosaic
              // to the other screen of a foldable after it went to the background, say) would leave that copy black, so
              // Mosaic restarts instead (RestartActivity) and picks the stream back up. Called first thing in onCreate
              private fun mosaicRestartIfRecreated() {
                  if (!mosaicCreated) {
                      mosaicCreated = true
                      return
                  }
                  android.util.Log.w("Mosaic", "a second copy of the activity: restarting Mosaic")
                  try { stopService(android.content.Intent(this, PlaybackService::class.java)) } catch (_: Exception) { }
                  val restart = android.content.Intent(this, RestartActivity::class.java)
                      .putExtra(RestartActivity.EXTRA_PID, android.os.Process.myPid())
                      .addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(restart)
                  Runtime.getRuntime().exit(0)
              }

              // the web view the app lives in (found in the window, not a private field of Tauri's activity)
              private fun mosaicWebView(v: android.view.View?): android.webkit.WebView? {
                  if (v is android.webkit.WebView) return v
                  if (v is android.view.ViewGroup) {
                      for (i in 0 until v.childCount) {
                          mosaicWebView(v.getChildAt(i))?.let { return it }
                      }
                  }
                  return null
              }

              // Background audio (the player's Options; app_extras.rs set_background_playback): 0 never, 1 while the
              // screen is locked, 2 always; and whether a stream is playing. While one plays with it on, PlaybackService
              // keeps Mosaic awake with the screen off
              private var mosaicBgMode = 0
              private var mosaicPlaying = false

              @Suppress("unused") // called from Rust (JNI)
              fun mosaicSetBackground(mode: Int, playing: Boolean, title: String) {
                  mosaicBgMode = mode
                  mosaicPlaying = playing
                  val service = android.content.Intent(this, PlaybackService::class.java)
                  try {
                      if (playing && mode > 0) {
                          service.putExtra("title", title)
                          if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(service) else startService(service)
                      } else {
                          stopService(service)
                      }
                  } catch (e: Exception) {
                      android.util.Log.w("Mosaic", "background playback service: $e")
                  }
              }

              // keep the stream going while the app is out of sight: floating (picture-in-picture), or Background audio
              // says so (Always, or When locked with the screen off)
              private fun mosaicKeepPlaying(): Boolean {
                  if (isInPictureInPictureMode) return true
                  if (!mosaicPlaying) return false
                  if (mosaicBgMode == 2) return true
                  if (mosaicBgMode == 1) {
                      val power = getSystemService(android.content.Context.POWER_SERVICE) as android.os.PowerManager
                      return !power.isInteractive
                  }
                  return false
              }

              // Android pauses the activity (floating, locked, another app in front) and Tauri pauses the web view with
              // it, which stops the stream. When it should keep going, resume the web view
              override fun onPause() {
                  super.onPause()
                  if (mosaicKeepPlaying()) mosaicWebView(window.decorView)?.onResume()
              }

              override fun onStop() {
                  super.onStop()
                  if (mosaicKeepPlaying()) mosaicWebView(window.decorView)?.onResume()
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: android.content.res.Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  if (isInPictureInPictureMode) mosaicWebView(window.decorView)?.onResume()
              }

              override fun onDestroy() {
                  // the app closing stops the playback service with it
                  try { stopService(android.content.Intent(this, PlaybackService::class.java)) } catch (_: Exception) { }
                  super.onDestroy()
              }
          """
          m = re.search(r"(class MainActivity\s*:\s*TauriActivity\(\))(\s*\{)?", src)
          if not m:
              sys.exit("couldn't find class MainActivity : TauriActivity()")
          if m.group(2):
              src = src[:m.end()] + methods + src[m.end():]
          else:
              src = src[:m.end(1)] + " {" + methods + "}" + src[m.end(1):]
          # mosaicRestartIfRecreated first thing in onCreate: Tauri's template may have its own onCreate
          oc = re.search(r"override fun onCreate\(savedInstanceState: (?:android\.os\.)?Bundle\?\)\s*\{", src)
          if oc:
              src = src[:oc.end()] + "\n        mosaicRestartIfRecreated()" + src[oc.end():]
          else:
              m2 = re.search(r"class MainActivity\s*:\s*TauriActivity\(\)\s*\{", src)
              src = src[:m2.end()] + """
              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  mosaicRestartIfRecreated()
                  super.onCreate(savedInstanceState)
              }
          """ + src[m2.end():]
          open(path, "w").write(src)
          PY
          echo "After:"; cat "$f"

      # Folding or unfolding a phone (a Galaxy Z Flip's cover and main screens), or a change of display size or
      # density, would otherwise make Android tear Mosaic's activity down and build it again, which Tauri's app
      # can't come back from (it froze on a black screen). Saying the activity handles those changes itself keeps
      # it running; the page just lays itself out for the new screen
      - name: Keep running when the phone folds or the screen changes
        run: |
          f=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          python3 - "$f" <<'PY'
          import re, sys
          path = sys.argv[1]
          src = open(path).read()
          want = ["orientation", "keyboardHidden", "keyboard", "screenSize", "smallestScreenSize", "screenLayout",
                  "density", "uiMode", "locale", "layoutDirection", "fontScale", "navigation", "colorMode"]
          m = re.search(r"<activity\b[^>]*android:name=\"\.MainActivity\"[^>]*>", src, re.S)
          if not m:
              sys.exit("couldn't find the MainActivity <activity> tag in the manifest")
          tag = m.group(0)
          cur = re.search(r'android:configChanges="([^"]*)"', tag)
          have = cur.group(1).split("|") if cur else []
          merged = "|".join(have + [w for w in want if w not in have])
          if cur:
              new_tag = tag[:cur.start()] + f'android:configChanges="{merged}"' + tag[cur.end():]
          else:
              new_tag = tag.replace("<activity", f'<activity android:configChanges="{merged}"', 1)
          src = src[:m.start()] + new_tag + src[m.end():]
          open(path, "w").write(src)
          print(new_tag)
          PY
          grep -q 'density' "$f" || { echo "::error::couldn't set the activity's configChanges"; exit 1; }

      # what PlaybackService needs: to run as a foreground service that plays media, to keep the processor awake,
      # and to show its notification (Android 13+ asks you about notifications; without them it still plays)
      - name: Allow background playback
        run: |
          f=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          python3 - "$f" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          perms = ["android.permission.FOREGROUND_SERVICE", "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
                   "android.permission.WAKE_LOCK", "android.permission.POST_NOTIFICATIONS"]
          add = "".join(f'    <uses-permission android:name="{p}" />\n' for p in perms if f'"{p}"' not in src)
          i = src.find("<application")
          if i < 0:
              sys.exit("couldn't find <application in the manifest")
          src = src[:i] + add + src[i:]
          service = ('        <service android:name=".PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n'
                     '        <activity android:name=".RestartActivity" android:process=":restart" android:exported="false"'
                     ' android:theme="@android:style/Theme.Translucent.NoTitleBar" android:excludeFromRecents="true" />\n')
          j = src.rfind("</application>")
          if j < 0:
              sys.exit("couldn't find </application> in the manifest")
          src = src[:j] + service + src[j:]
          open(path, "w").write(src)
          PY
          cat "$f"
          grep -q 'PlaybackService' "$f" || { echo "::error::couldn't add the playback service to the manifest"; exit 1; }

      - name: Build the APK
        run: npx tauri android build --apk --target aarch64
        env:
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}

      - name: Sign the APK
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n1)
          if [ -z "$unsigned" ]; then echo "::error::no unsigned APK found"; find src-tauri/gen/android/app/build/outputs -name '*.apk'; exit 1; fi
          echo "Built: $unsigned"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            kind=signed
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a throwaway key. The next build won't install over this one."
            KEYSTORE_PASSWORD=throwaway-$GITHUB_RUN_ID; KEY_ALIAS=mosaic
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Mosaic test build"
            kind=test-signed
          fi
          version=$(node -p "require('./package.json').version")
          out="Mosaic-$version-android-arm64.apk"
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$out" aligned.apk
          "$tools/apksigner" verify --print-certs "$out"
          rm -f "$RUNNER_TEMP/release.jks" aligned.apk
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: Mosaic-android-arm64-${{ steps.sign.outputs.kind }}
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error

      - name: Attach the APK to the release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && steps.sign.outputs.kind == 'signed'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" "${{ steps.sign.outputs.apk }}" --clobber
